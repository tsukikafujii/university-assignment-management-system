<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課題管理ダッシュボード</title>
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #ffffff;
    --surface2: #faf7f2;
    --accent: #4f46e5;
    --green: #16a34a;
    --yellow: #d97706;
    --red: #dc2626;
    --text: #1c1917;
    --muted: #78716c;
    --border: #e7e0d5;
    --shadow: 0 1px 4px rgba(0,0,0,.07), 0 2px 12px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ヘッダー */
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  .logo { font-size: 1.25rem; font-weight: 800; color: var(--accent); letter-spacing: .5px; }
  .header-right { display: flex; gap: 12px; align-items: center; }
  .date-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 500;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 700;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 2px 8px rgba(79,70,229,.25);
  }
  .btn:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,.3); }
  .btn-outline {
    background: #fff;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    box-shadow: none;
  }
  .btn-outline:hover { background: #eef2ff; }

  /* メインレイアウト */
  main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

  /* サマリーカード */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .summary-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 0 0 14px 14px;
  }
  .card-overdue::after { background: var(--red); }
  .card-today::after  { background: var(--yellow); }
  .card-week::after   { background: var(--accent); }
  .card-done::after   { background: var(--green); }
  .card-icon { font-size: 1.4rem; margin-bottom: 2px; }
  .card-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
  .card-number { font-size: 2.6rem; font-weight: 900; line-height: 1; }
  .card-overdue .card-number { color: var(--red); }
  .card-today .card-number  { color: var(--yellow); }
  .card-week .card-number   { color: var(--accent); }
  .card-done .card-number   { color: var(--green); }
  .card-sub { font-size: 0.75rem; color: var(--muted); }

  /* 2カラムレイアウト */
  .two-col { display: grid; grid-template-columns: 1fr 320px; gap: 18px; }

  /* セクション */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .badge {
    background: #eef2ff;
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 600;
  }

  /* タブ */
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; background: var(--surface2); border-radius: 10px; padding: 4px; }
  .tab {
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 7px 16px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    font-weight: 500;
    flex: 1;
  }
  .tab.active { background: #fff; color: var(--accent); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  /* 課題リスト */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .task-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(79,70,229,.1); transform: translateX(2px); }
  .task-item.done { opacity: .55; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--muted); }
  .urgency-bar {
    width: 4px;
    height: 38px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .urgent  { background: var(--red); }
  .soon    { background: var(--yellow); }
  .normal  { background: #86efac; }
  .done-dot{ background: #d4d0cc; }
  .task-info { flex: 1; min-width: 0; }
  .task-subject { font-size: 0.72rem; color: var(--muted); margin-bottom: 1px; font-weight: 600; letter-spacing: .3px; }
  .task-title { font-size: 0.93rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; gap: 8px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
  .task-due { font-size: 0.74rem; color: var(--muted); }
  .task-due.overdue { color: var(--red); font-weight: 700; }
  .task-due.today   { color: var(--yellow); font-weight: 700; }
  .task-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    font-weight: 600;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: #eef2ff; }
  .icon-btn.complete:hover { border-color: var(--green); color: var(--green); background: #f0fdf4; }
  .priority-chip {
    font-size: 0.7rem;
    border-radius: 5px;
    padding: 2px 7px;
    font-weight: 700;
  }
  .p-high { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
  .p-mid  { background: #fffbeb; color: var(--yellow); border: 1px solid #fde68a; }
  .p-low  { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }

  /* 週間カレンダー */
  .day-col {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 5px;
    min-height: 90px;
  }
  .day-col.today-col { border-color: var(--accent); background: #f5f3ff; }
  .day-num {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    margin-bottom: 5px;
  }
  .today-col .day-num {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 5px;
    font-size: 0.75rem;
  }
  .cal-task {
    font-size: 0.63rem;
    border-radius: 4px;
    padding: 2px 5px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    font-weight: 600;
  }
  .cal-urgent { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .cal-soon   { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .cal-normal { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
  .cal-done   { background: #f5f5f4; color: #a8a29e; text-decoration: line-through; }

  /* 右カラム */
  .right-col { display: flex; flex-direction: column; gap: 16px; }

  /* 進捗リング */
  .progress-section { text-align: center; padding: 8px 0 14px; }
  .ring-wrap { position: relative; display: inline-block; }
  .ring-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  .ring-pct { font-size: 1.7rem; font-weight: 900; color: var(--accent); }
  .ring-sub { font-size: 0.72rem; color: var(--muted); font-weight: 500; }

  /* 科目別バー */
  .subject-bars { display: flex; flex-direction: column; gap: 12px; }
  .subj-head { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
  .subj-name { color: var(--text); font-weight: 600; }
  .subj-cnt  { color: var(--muted); }
  .bar-bg { background: var(--border); border-radius: 6px; height: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width .5s ease; }

  /* 通知セクション */
  .notif-list { display: flex; flex-direction: column; gap: 8px; }
  .notif-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 10px 13px;
    font-size: 0.82rem;
  }
  .notif-item.urgent-notif { border-left-color: var(--red); background: #fff9f9; }
  .notif-title { font-weight: 700; color: var(--text); margin-bottom: 2px; font-size: 0.83rem; }
  .notif-body  { color: var(--muted); font-size: 0.76rem; }
  .notif-empty { color: var(--muted); font-size: 0.82rem; text-align: center; padding: 20px; }

  /* モーダル */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(30,27,20,.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 30px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.14);
  }
  .modal-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; color: var(--text); }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 13px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 70px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .btn-cancel { background: var(--surface2); color: var(--muted); box-shadow: none; }
  .btn-cancel:hover { background: var(--border); transform: none; box-shadow: none; }

  /* 通知許可バナー */
  .notif-banner {
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.83rem;
    color: #3730a3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
    font-weight: 500;
  }
  .notif-banner.hidden { display: none; }

  /* 空状態 */
  .empty-state { text-align: center; padding: 36px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }

  /* レスポンシブ */
  @media (max-width: 1000px) {
    .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    main { padding: 14px; }
    header { padding: 12px 16px; }
  }

  /* スクロールバー */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ============ やる気システム ============ */

  /* 今日の一言 */
  .quote-card {
    background: linear-gradient(135deg, #eef2ff 0%, #fdf4ff 100%);
    border: 1px solid #c7d2fe;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 0;
  }
  .quote-label { font-size: 0.72rem; color: #6366f1; font-weight: 700; margin-bottom: 5px; letter-spacing: .4px; }
  .quote-text  { font-size: 0.88rem; color: #3730a3; font-weight: 600; line-height: 1.5; }
  .quote-author { font-size: 0.73rem; color: #818cf8; margin-top: 4px; }

  /* レベルカード */
  .level-card {
    background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
    border: 1px solid #fed7aa;
    border-radius: 12px;
    padding: 16px;
  }
  .level-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .level-badge {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 800;
    border-radius: 20px;
    padding: 3px 10px;
    letter-spacing: .5px;
  }
  .level-title { font-size: 0.95rem; font-weight: 800; color: #92400e; }
  .xp-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #b45309; margin-bottom: 5px; font-weight: 600; }
  .xp-bar-bg { background: #fde68a; border-radius: 6px; height: 8px; overflow: hidden; }
  .xp-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #f59e0b, #ef4444); transition: width .6s ease; }

  /* ストリーク */
  .streak-row {
    display: flex; align-items: center; gap: 6px;
    background: #fff;
    border: 1px solid #fed7aa;
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 10px;
  }
  .streak-flame { font-size: 1.3rem; }
  .streak-num { font-size: 1.3rem; font-weight: 900; color: #ea580c; }
  .streak-label { font-size: 0.75rem; color: #b45309; font-weight: 600; }

  /* バッジ */
  .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .badge-item {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 5px;
    text-align: center;
    transition: border-color .2s, transform .15s;
    cursor: default;
  }
  .badge-item.earned { border-color: #fbbf24; background: #fffbeb; }
  .badge-item:not(.earned) { opacity: .35; filter: grayscale(1); }
  .badge-emoji { font-size: 1.3rem; display: block; margin-bottom: 3px; }
  .badge-name  { font-size: 0.63rem; color: var(--muted); font-weight: 600; }
  .badge-item.earned .badge-name { color: #92400e; }

  /* トースト */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1c1917;
    color: #fff;
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
    z-index: 999;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
    text-align: center;
    min-width: 200px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-xp { font-size: 0.8rem; color: #fbbf24; margin-top: 3px; font-weight: 600; }

  /* 紙吹雪 canvas */
  #confettiCanvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 998;
  }

  /* レベルアップ演出 */
  .levelup-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 500;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
  }
  .levelup-overlay.show { display: flex; }
  .levelup-box {
    background: linear-gradient(135deg, #fff7ed, #fef3c7);
    border: 3px solid #f59e0b;
    border-radius: 24px;
    padding: 40px 50px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .levelup-emoji { font-size: 4rem; display: block; margin-bottom: 10px; }
  .levelup-title { font-size: 1.6rem; font-weight: 900; color: #92400e; }
  .levelup-sub   { font-size: 1rem; color: #b45309; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="logo">📚 課題ダッシュボード</div>
  <div class="header-right">
    <div class="date-badge" id="headerDate"></div>
    <button class="btn btn-outline" onclick="openRecurringList()" style="margin-right:4px;">🔁 定期課題</button>
    <button class="btn" onclick="openModal()">＋ 課題を追加</button>
  </div>
</header>

<main>
  <!-- 通知許可バナー -->
  <div class="notif-banner" id="notifBanner">
    <span>🔔 ブラウザ通知を有効にすると締切リマインダーが届きます</span>
    <button class="btn btn-outline" style="font-size:.8rem;padding:5px 12px;" onclick="requestNotifPermission()">許可する</button>
  </div>

  <!-- サマリーカード -->
  <div class="summary-grid">
    <div class="summary-card card-overdue">
      <div class="card-label">期限切れ</div>
      <div class="card-number" id="cnt-overdue">0</div>
      <div class="card-sub">早急に対処を</div>
    </div>
    <div class="summary-card card-today">
      <div class="card-label">今日締切</div>
      <div class="card-number" id="cnt-today">0</div>
      <div class="card-sub">本日中に提出</div>
    </div>
    <div class="summary-card card-week">
      <div class="card-label">今週締切</div>
      <div class="card-number" id="cnt-week">0</div>
      <div class="card-sub">7日以内</div>
    </div>
    <div class="summary-card card-done">
      <div class="card-label">完了済み</div>
      <div class="card-number" id="cnt-done">0</div>
      <div class="card-sub">お疲れ様！</div>
    </div>
  </div>

  <!-- メイン2カラム -->
  <div class="two-col">

    <!-- 左：課題リスト + 週カレンダー -->
    <div style="display:flex;flex-direction:column;gap:20px;">

      <!-- 課題リスト -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">課題一覧</div>
          <span class="badge" id="list-count">0件</span>
        </div>
        <div class="tabs">
          <button class="tab active" onclick="setTab('all',this)">すべて</button>
          <button class="tab" onclick="setTab('active',this)">未完了</button>
          <button class="tab" onclick="setTab('overdue',this)">期限切れ</button>
          <button class="tab" onclick="setTab('done',this)">完了</button>
        </div>
        <div class="task-list" id="taskList">
          <div class="empty-state"><span class="emoji">✏️</span>課題を追加してみよう！</div>
        </div>
      </div>

      <!-- 週間カレンダー -->
      <div class="section">
        <div class="section-header">
          <div class="section-title">今週の締切カレンダー</div>
          <div style="font-size:.75rem;color:var(--muted)" id="weekRange"></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;" id="dayLabels"></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;" id="calGrid"></div>
      </div>

    </div>

    <!-- 右カラム -->
    <div class="right-col">

      <!-- 今日の一言 -->
      <div class="section" style="padding:16px 18px;">
        <div class="quote-card" id="quoteCard">
          <div class="quote-label">💬 今日の一言</div>
          <div class="quote-text" id="quoteText">…</div>
          <div class="quote-author" id="quoteAuthor"></div>
        </div>
      </div>

      <!-- レベル・XP・ストリーク -->
      <div class="section" style="padding:16px 18px;">
        <div class="section-header" style="margin-bottom:10px;">
          <div class="section-title">🎮 やる気ステータス</div>
        </div>
        <div class="level-card">
          <div class="level-head">
            <span class="level-badge" id="levelBadge">Lv.1</span>

<script>
// =========================================================
// 定期課題システム
// =========================================================
const RECURRING_KEY = 'kadai_recurring_v1';
let recurring = JSON.parse(localStorage.getItem(RECURRING_KEY) || '[]');
let recurringEditId = null;
function saveRecurring() {
  const subj  = document.getElementById('rf-subject').value.trim();
  const title = document.getElementById('rf-title').value.trim();
  if (!subj || !title) { alert('科目名と課題タイトルは必須です'); return; }
  const data = {
    subject:     subj,
    title:       title,
    dayOfWeek:   parseInt(document.getElementById('rf-day').value),
    startTime:   document.getElementById('rf-startTime').value,
    offsetDays:  parseInt(document.getElementById('rf-offsetDays').value),
    dueTime:     document.getElementById('rf-dueTime').value,
    priority:    document.getElementById('rf-priority').value,
    submit:      document.getElementById('rf-submit').value,
    notes:       document.getElementById('rf-notes').value,
    enabled:     true,
  };
  if (recurringEditId) {
    const idx = recurring.findIndex(r => r.id === recurringEditId);
    recurring[idx] = { ...recurring[idx], ...data };
  } else {
    recurring.push({ id: genId(), ...data });
  }
  localStorage.setItem(RECURRING_KEY, JSON.stringify(recurring));
  generateRecurringTasks();
  render();
  closeRecurringEdit();
  renderRecurringList();
}

function deleteRecurring(id) {
  if (!confirm('この定期課題テンプレートを削除しますか？\n（生成済みの課題は残ります）')) return;
  recurring = recurring.filter(r => r.id !== id);
  localStorage.setItem(RECURRING_KEY, JSON.stringify(recurring));
  renderRecurringList();
}

function toggleRecurringEnabled(id) {
  const r = recurring.find(x => x.id === id);
  if (r) r.enabled = !r.enabled;
  localStorage.setItem(RECURRING_KEY, JSON.stringify(recurring));
  renderRecurringList();
}

// 今日から4週間分の課題を自動生成
function generateRecurringTasks() {
  const WEEKS_AHEAD = 4;
  let changed = false;
  recurring.filter(r => r.enabled).forEach(r => {
    for (let w = 0; w < WEEKS_AHEAD; w++) {
      // 発生曜日の日付を計算
      const base = new Date(); base.setHours(0,0,0,0);
      const diff = (r.dayOfWeek - base.getDay() + 7) % 7 + w * 7;
      const occur = new Date(base); occur.setDate(base.getDate() + diff);
      // 締切日
      const dueD = new Date(occur); dueD.setDate(occur.getDate() + r.offsetDays);
      const dueStr = dueD.toISOString().slice(0, 10);
      // 重複チェック（同じrecurringId + 締切日）
      const alreadyExists = tasks.some(t => t.recurringId === r.id && t.due === dueStr);
      if (!alreadyExists) {
        tasks.push({
          id:          genId(),
          recurringId: r.id,
          subject:     r.subject,
          title:       r.title,
          due:         dueStr,
          time:        r.dueTime,
          priority:    r.priority,
          submit:      r.submit,
          notes:       r.notes,
          done:        false,
          createdAt:   new Date().toISOString(),
        });
        changed = true;
      }
    }
  });
  if (changed) save();
}

const DOW_JP = ['日','月','火','水','木','金','土'];
function renderRecurringList() {
  const el = document.getElementById('recurringListBody');
  if (!recurring.length) {
    el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;font-size:.88rem;">定期課題がまだありません。＋新規追加から登録してください。</div>';
    return;
  }
  el.innerHTML = recurring.map(r => {
    const dueLabel = r.offsetDays === 0 ? '同日' : r.offsetDays === 1 ? '翌日' : `${r.offsetDays}日後`;
    const prioColor = r.priority === 'high' ? 'var(--red)' : r.priority === 'low' ? 'var(--green)' : 'var(--yellow)';
    return `
      <div style="background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:.72rem;color:var(--muted);font-weight:600;">${esc(r.subject)}</div>
          <div style="font-size:.93rem;font-weight:700;color:var(--text);">${esc(r.title)}</div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:3px;">
            毎週<b style="color:var(--text);">${DOW_JP[r.dayOfWeek]}曜</b>${r.startTime ? ' ' + r.startTime + '〜' : ''}
            → 締切 <b style="color:${prioColor};">${dueLabel} ${r.dueTime}</b>
            ${r.submit ? '　📤' + r.submit : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="icon-btn" onclick="toggleRecurringEnabled('${r.id}')" title="${r.enabled?'無効化':'有効化'}" style="color:${r.enabled?'var(--green)':'var(--muted)'};">
            ${r.enabled ? '✓ON' : 'OFF'}
          </button>
          <button class="icon-btn" onclick="openRecurringEdit('${r.id}')">編集</button>
          <button class="icon-btn" onclick="deleteRecurring('${r.id}')" style="color:var(--red);">削除</button>
        </div>
      </div>`;
  }).join('');
}

function openRecurringList() {
  renderRecurringList();
  document.getElementById('recurringListOverlay').classList.add('show');
}
function closeRecurringList() { document.getElementById('recurringListOverlay').classList.remove('show'); }
function closeRecurringListOutside(e) { if (e.target === document.getElementById('recurringListOverlay')) closeRecurringList(); }

function openRecurringEdit(id = null) {
  recurringEditId = id;
  document.getElementById('recurringEditTitle').textContent = id ? '定期課題を編集' : '定期課題を追加';
  if (id) {
    const r = recurring.find(x => x.id === id);
    document.getElementById('rf-subject').value   = r.subject || '';
    document.getElementById('rf-title').value     = r.title || '';
    document.getElementById('rf-day').value       = r.dayOfWeek;
    document.getElementById('rf-startTime').value = r.startTime || '';
    document.getElementById('rf-offsetDays').value = r.offsetDays;
    document.getElementById('rf-dueTime').value   = r.dueTime || '23:59';
    document.getElementById('rf-priority').value  = r.priority || 'mid';
    document.getElementById('rf-submit').value    = r.submit || '';
    document.getElementById('rf-notes').value     = r.notes || '';
  } else {
    document.getElementById('rf-subject').value = '';
    document.getElementById('rf-title').value = '';
    document.getElementById('rf-day').value = '2';
    document.getElementById('rf-startTime').value = '14:30';
    document.getElementById('rf-offsetDays').value = '1';
    document.getElementById('rf-dueTime').value = '16:00';
    document.getElementById('rf-priority').value = 'mid';
    document.getElementById('rf-submit').value = '';
    document.getElementById('rf-notes').value = '';
  }
  document.getElementById('recurringEditOverlay').classList.add('show');
  setTimeout(() => document.getElementById('rf-subject').focus(), 100);
}
function closeRecurringEdit() { document.getElementById('recurringEditOverlay').classList.remove('show'); recurringEditId = null; }
function closeRecurringEditOutside(e) { if (e.target === document.getElementById('recurringEditOverlay')) closeRecurringEdit(); }

// =========================================================
// やる気ゲームシステム
// =========================================================
const GAME_KEY = 'kadai_game_v1';
const defaultGame = { xp:0, level:1, streak:0, lastDoneDate:'', totalDone:0, highDone:0, badges:[] };
let game = { ...defaultGame, ...JSON.parse(localStorage.getItem(GAME_KEY) || '{}') };
function saveGame() { localStorage.setItem(GAME_KEY, JSON.stringify(game)); }

const LEVELS = [
  { lv:1,  name:'新入生',     xpNeeded:100  },
  { lv:2,  name:'勉強中',     xpNeeded:250  },
  { lv:3,  name:'努力家',     xpNeeded:500  },
  { lv:4,  name:'頑張り屋',   xpNeeded:900  },
  { lv:5,  name:'優等生',     xpNeeded:1400 },
  { lv:6,  name:'秀才',       xpNeeded:2000 },
  { lv:7,  name:'エリート',   xpNeeded:2800 },
  { lv:8,  name:'天才',       xpNeeded:3800 },
  { lv:9,  name:'学年首席',   xpNeeded:5000 },
  { lv:10, name:'伝説の学生', xpNeeded:Infinity },
];
function getLevelInfo() {
  for (let i = LEVELS.length-1; i >= 0; i--) {
    if (game.xp >= (LEVELS[i-1]?.xpNeeded || 0)) {
      const cur = LEVELS[i]; const next = LEVELS[i+1];
      const base = LEVELS[i-1]?.xpNeeded || 0;
      return { lv: cur.lv, name: cur.name, nextXp: cur.xpNeeded, baseXp: base, next };
    }
  }
  return { lv:1, name:'新入生', nextXp:100, baseXp:0, next: LEVELS[1] };
}

const ALL_BADGES = [
  { id:'first',    emoji:'🌱', name:'はじめの一歩', desc:'最初の課題を完了' },
  { id:'streak3',  emoji:'🔥', name:'3日連続',      desc:'3日連続で完了'   },
  { id:'streak7',  emoji:'⚡', name:'一週間無敵',   desc:'7日連続で完了'   },
  { id:'total5',   emoji:'📚', name:'5課題突破',    desc:'累計5件完了'     },
  { id:'total10',  emoji:'🏆', name:'10課題達成',   desc:'累計10件完了'    },
  { id:'highprio', emoji:'🚀', name:'急務クリア',   desc:'高優先度5件完了' },
  { id:'early',    emoji:'⏰', name:'余裕の提出',   desc:'締切3日前に完了' },
  { id:'lv5',      emoji:'⭐', name:'Lv.5到達',     desc:'レベル5に到達'   },
];

function awardXp(amount, task) {
  const prevLv = getLevelInfo().lv;
  game.xp += amount;
  const newInfo = getLevelInfo();
  if (newInfo.lv > prevLv) {
    game.level = newInfo.lv;
    saveGame();
    setTimeout(() => {
      document.getElementById('levelupTitle').textContent = `Lv.${newInfo.lv} ${newInfo.name} に昇格！`;
      document.getElementById('levelupSub').textContent = `🎊 おめでとう！ さらに上を目指そう！`;
      document.getElementById('levelupOverlay').classList.add('show');
      launchConfetti(200);
    }, 600);
  }
  saveGame();
}

function checkBadges(task) {
  const newBadges = [];
  const earned = game.badges;
  const done = tasks.filter(t=>t.done);
  const highDone = done.filter(t=>t.priority==='high').length;

  if (!earned.includes('first') && game.totalDone >= 1)    newBadges.push('first');
  if (!earned.includes('streak3') && game.streak >= 3)     newBadges.push('streak3');
  if (!earned.includes('streak7') && game.streak >= 7)     newBadges.push('streak7');
  if (!earned.includes('total5')  && game.totalDone >= 5)  newBadges.push('total5');
  if (!earned.includes('total10') && game.totalDone >= 10) newBadges.push('total10');
  if (!earned.includes('highprio')&& highDone >= 5)        newBadges.push('highprio');
  if (!earned.includes('early') && task && !task.done && daysDiff(task) >= 3) newBadges.push('early');
  if (!earned.includes('lv5') && getLevelInfo().lv >= 5)   newBadges.push('lv5');

  newBadges.forEach(id => {
    game.badges.push(id);
    const b = ALL_BADGES.find(x=>x.id===id);
    setTimeout(() => showToast(`🏅 バッジ獲得！ ${b.emoji} ${b.name}`, ''), 1200);
  });
  if (newBadges.length) saveGame();
}

function updateStreak() {
  const todayStr = new Date().toISOString().slice(0,10);
  const lastStr = game.lastDoneDate;
  if (lastStr === todayStr) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().slice(0,10);
  game.streak = (lastStr === yStr) ? game.streak + 1 : 1;
  game.lastDoneDate = todayStr;
  saveGame();
}

function renderMotivation() {
  const info = getLevelInfo();
  const pct = info.nextXp === Infinity ? 100 :
    Math.min(100, Math.round((game.xp - info.baseXp) / (info.nextXp - info.baseXp) * 100));
  document.getElementById('levelBadge').textContent = `Lv.${info.lv}`;
  document.getElementById('levelTitle').textContent = info.name;
  document.getElementById('xpCurrent').textContent = `${game.xp} XP`;
  document.getElementById('xpNext').textContent = info.nextXp === Infinity
    ? '🎓 最高レベル！' : `次まで ${info.nextXp - game.xp} XP`;
  document.getElementById('xpBar').style.width = pct + '%';
  document.getElementById('streakNum').textContent = game.streak;

  document.getElementById('badgeGrid').innerHTML = ALL_BADGES.map(b => {
    const earned = game.badges.includes(b.id);
    return `<div class="badge-item ${earned?'earned':''}" title="${b.desc}">
      <span class="badge-emoji">${b.emoji}</span>
      <div class="badge-name">${b.name}</div>
    </div>`;
  }).join('');
}

// 紙吹雪
function launchConfetti(count=80) {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#f59e0b','#ef4444','#6366f1','#10b981','#ec4899','#3b82f6'];
  const pieces = Array.from({length:count}, () => ({
    x: Math.random()*canvas.width,
    y: -10 - Math.random()*200,
    r: 4+Math.random()*6,
    color: colors[Math.floor(Math.random()*colors.length)],
    vx: (Math.random()-.5)*4,
    vy: 2+Math.random()*4,
    rot: Math.random()*360,
    vr: (Math.random()-.5)*8,
  }));
  let frame;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
    });
    if (pieces.some(p=>p.y < canvas.height)) {
      frame = requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  cancelAnimationFrame(frame); draw();
  setTimeout(() => { cancelAnimationFrame(frame); ctx.clearRect(0,0,canvas.width,canvas.height); }, 4000);
}

const PRAISE = ['よくやった！🎊','すばらしい！✨','完璧です！🌟','さすが！👏','最高〜！🔥','その調子！💪','一歩前進！🚀'];

const STORAGE_KEY = 'kadai_v1';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editId = null;
let currentTab = 'all';

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
function genId() { return Date.now() + Math.random().toString(36).slice(2); }

// =========================================================
// 日付ユーティリティ
// =========================================================
function today() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}
function dueDate(task) {
  const d = new Date(task.due + 'T' + (task.time || '23:59') + ':00');
  return d;
}
function daysDiff(task) {
  const diff = dueDate(task) - today();
  return Math.ceil(diff / 86400000);
}
function urgency(task) {
  if (task.done) return 'done';
  const d = daysDiff(task);
  if (d < 0) return 'overdue';
  if (d === 0) return 'today';
  if (d <= 3) return 'soon';
  return 'normal';
}
function formatDue(task) {
  const d = new Date(task.due + 'T00:00:00');
  const days = daysDiff(task);
  const dow = ['日','月','火','水','木','金','土'][d.getDay()];
  const base = `${d.getMonth()+1}/${d.getDate()}(${dow}) ${task.time||'23:59'}`;
  if (task.done) return base;
  if (days < 0) return base + ` — ${Math.abs(days)}日超過`;
  if (days === 0) return base + ' — 今日！';
  if (days === 1) return base + ' — 明日';
  return base + ` — あと${days}日`;
}
function jpDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

// =========================================================
// ヘッダー日付
// =========================================================
function updateHeaderDate() {
  const d = new Date();
  const dow = ['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('headerDate').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${dow})`;
}

// =========================================================
// サマリーカード
// =========================================================
function updateSummary() {
  const t = today();
  const weekEnd = new Date(t); weekEnd.setDate(weekEnd.getDate() + 7);
  let ov=0, tod=0, wk=0, dn=0;
  tasks.forEach(task => {
    if (task.done) { dn++; return; }
    const d = daysDiff(task);
    if (d < 0) ov++;
    else if (d === 0) tod++;
    else if (d <= 7) wk++;
  });
  document.getElementById('cnt-overdue').textContent = ov;
  document.getElementById('cnt-today').textContent = tod;
  document.getElementById('cnt-week').textContent = wk;
  document.getElementById('cnt-done').textContent = dn;
}

// =========================================================
// 課題リスト描画
// =========================================================
function filteredTasks() {
  let list = [...tasks];
  if (currentTab === 'active') list = list.filter(t => !t.done);
  else if (currentTab === 'overdue') list = list.filter(t => !t.done && daysDiff(t) < 0);
  else if (currentTab === 'done') list = list.filter(t => t.done);
  // ソート: 完了→最後, 期限切れ→先頭, 残り日数昇順
  list.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return daysDiff(a) - daysDiff(b);
  });
  return list;
}

function renderList() {
  const list = filteredTasks();
  const el = document.getElementById('taskList');
  document.getElementById('list-count').textContent = `${list.length}件`;
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><span class="emoji">✨</span>表示する課題がありません</div>';
    return;
  }
  el.innerHTML = list.map(task => {
    const urg = urgency(task);
    const dotClass = task.done ? 'done-dot' : urg === 'overdue' ? 'urgent' : urg === 'today' || urg === 'soon' ? 'soon' : 'normal';
    const dueClass = urg === 'overdue' ? 'overdue' : urg === 'today' ? 'today' : '';
    const prioClass = task.priority === 'high' ? 'p-high' : task.priority === 'low' ? 'p-low' : 'p-mid';
    const prioLabel = task.priority === 'high' ? '高' : task.priority === 'low' ? '低' : '中';
    const submitBadge = task.submit ? `<span style="font-size:.68rem;color:var(--muted);">📤${task.submit}</span>` : '';
    return `
      <div class="task-item ${task.done?'done':''}" onclick="editTask('${task.id}')">
        <div class="urgency-dot ${dotClass}"></div>
        <div class="task-info">
          <div class="task-subject">${esc(task.subject)}</div>
          <div class="task-title">${esc(task.title)}</div>
          <div class="task-meta">
            <span class="task-due ${dueClass}">📅 ${formatDue(task)}</span>
            <span class="priority-chip ${prioClass}">優先度 ${prioLabel}</span>
            ${submitBadge}
          </div>
        </div>
        <div class="task-actions" onclick="event.stopPropagation()">
          <button class="icon-btn complete" onclick="toggleDone('${task.id}')" title="${task.done?'未完了に戻す':'完了'}">
            ${task.done ? '↩' : '✓'}
          </button>
        </div>
      </div>`;
  }).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// =========================================================
// 週間カレンダー
// =========================================================
function renderCalendar() {
  const t = today();
  const dow = t.getDay();
  const weekStart = new Date(t); weekStart.setDate(t.getDate() - dow);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
  document.getElementById('weekRange').textContent =
    `${weekStart.getMonth()+1}/${weekStart.getDate()} 〜 ${weekEnd.getMonth()+1}/${weekEnd.getDate()}`;

  const labels = ['日','月','火','水','木','金','土'];
  document.getElementById('dayLabels').innerHTML = labels.map((l,i) => {
    const col = i===0?'color:#ff6584':i===6?'color:#6c63ff':'';
    return `<div style="text-align:center;font-size:.7rem;font-weight:600;${col};color:var(--muted);padding:2px">${l}</div>`;
  }).join('');

  const cells = [];
  for (let i=0;i<7;i++) {
    const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
    const isToday = d.toDateString() === t.toDateString();
    const dayStr = d.toISOString().slice(0,10);
    const dayTasks = tasks.filter(tk => tk.due === dayStr).sort((a,b)=>daysDiff(a)-daysDiff(b));

    const taskHtml = dayTasks.map(tk => {
      const cls = tk.done ? 'cal-done' : daysDiff(tk) < 0 ? 'cal-urgent' : daysDiff(tk) <= 1 ? 'cal-soon' : 'cal-normal';
      return `<div class="cal-task ${cls}" title="${esc(tk.subject)}: ${esc(tk.title)}">${esc(tk.title)}</div>`;
    }).join('');

    cells.push(`
      <div class="day-col ${isToday?'today-col':''}">
        <div class="day-num">${d.getDate()}</div>
        ${taskHtml}
      </div>`);
  }
  document.getElementById('calGrid').innerHTML = cells.join('');
}

// =========================================================
// 進捗・科目バー
// =========================================================
function renderProgress() {
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const pct = total === 0 ? 0 : Math.round(done/total*100);
  const circ = 314;
  document.getElementById('progressRing').style.strokeDashoffset = circ - circ * pct/100;
  document.getElementById('pctText').textContent = pct + '%';

  // 科目別
  const subjects = {};
  tasks.forEach(t => {
    if (!subjects[t.subject]) subjects[t.subject] = {total:0,done:0};
    subjects[t.subject].total++;
    if (t.done) subjects[t.subject].done++;
  });
  const colors = ['#6c63ff','#ff6584','#43e97b','#f9ca24','#38b2ff','#ff9a56'];
  const bars = Object.entries(subjects).map(([name,v],i) => {
    const p = Math.round(v.done/v.total*100);
    const col = colors[i % colors.length];
    return `
      <div class="subj-row">
        <div class="subj-head">
          <span class="subj-name">${esc(name)}</span>
          <span class="subj-cnt">${v.done}/${v.total}</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" style="width:${p}%;background:${col}"></div>
        </div>
      </div>`;
  });
  document.getElementById('subjectBars').innerHTML = bars.join('') || '<div style="color:var(--muted);font-size:.8rem;text-align:center;padding:10px">科目データなし</div>';
}

// =========================================================
// リマインダー一覧
// =========================================================
function renderNotifs() {
  const active = tasks.filter(t=>!t.done).sort((a,b)=>daysDiff(a)-daysDiff(b));
  const urgent = active.filter(t=>daysDiff(t)<0);
  const today_tasks = active.filter(t=>daysDiff(t)===0);
  const soon3 = active.filter(t=>daysDiff(t)>0&&daysDiff(t)<=3);

  const items = [];
  urgent.forEach(t => items.push({cls:'urgent-notif',title:`⚠️ 期限切れ: ${t.subject}`,body:`「${t.title}」 — ${Math.abs(daysDiff(t))}日超過`}));
  today_tasks.forEach(t => items.push({cls:'urgent-notif',title:`🚨 本日締切: ${t.subject}`,body:`「${t.title}」 — ${t.time||'23:59'}まで`}));
  soon3.forEach(t => items.push({cls:'',title:`📅 締切まで${daysDiff(t)}日: ${t.subject}`,body:`「${t.title}」 — ${t.due} ${t.time||'23:59'}`}));

  const el = document.getElementById('notifList');
  if (!items.length) {
    el.innerHTML = '<div class="notif-empty">締切が近い課題がありません 🎉</div>';
    return;
  }
  el.innerHTML = items.slice(0,6).map(n => `
    <div class="notif-item ${n.cls}">
      <div class="notif-title">${n.title}</div>
      <div class="notif-body">${esc(n.body)}</div>
    </div>`).join('');
}

// =========================================================
// ブラウザ通知
// =========================================================
function requestNotifPermission() {
  if (!('Notification' in window)) return alert('このブラウザは通知に対応していません');
  Notification.requestPermission().then(p => {
    if (p === 'granted') {
      document.getElementById('notifBanner').classList.add('hidden');
      scheduleNotifs();
    }
  });
}
function scheduleNotifs() {
  if (Notification.permission !== 'granted') return;
  const active = tasks.filter(t=>!t.done);
  active.forEach(task => {
    const d = daysDiff(task);
    if (d === 0) {
      new Notification(`🚨 本日締切: ${task.subject}`, {body:`「${task.title}」の締切は今日です！`,icon:'📚'});
    } else if (d === 1) {
      new Notification(`📅 明日締切: ${task.subject}`, {body:`「${task.title}」の締切は明日です`});
    }
  });
}
function checkNotifBanner() {
  if (!('Notification' in window) || Notification.permission === 'granted') {
    document.getElementById('notifBanner').classList.add('hidden');
  }
}

// モーダル
// =========================================================
function openModal(id=null) {
  editId = id;
  const modal = document.getElementById('overlay');
  document.getElementById('modalTitle').textContent = id ? '課題を編集' : '課題を追加';
  if (id) {
    const t = tasks.find(x=>x.id===id);
    document.getElementById('f-subject').value = t.subject||'';
    document.getElementById('f-title').value = t.title||'';
    document.getElementById('f-due').value = t.due||'';
    document.getElementById('f-time').value = t.time||'23:59';
    document.getElementById('f-priority').value = t.priority||'mid';
    document.getElementById('f-submit').value = t.submit||'';
    document.getElementById('f-notes').value = t.notes||'';
  } else {
    document.getElementById('f-subject').value='';
    document.getElementById('f-title').value='';
    const nxt = new Date(); nxt.setDate(nxt.getDate()+7);
    document.getElementById('f-due').value = nxt.toISOString().slice(0,10);
    document.getElementById('f-time').value='23:59';
    document.getElementById('f-priority').value='mid';
    document.getElementById('f-submit').value='';
    document.getElementById('f-notes').value='';
  }
  modal.classList.add('show');
  setTimeout(() => document.getElementById('f-subject').focus(), 100);
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); editId=null; }
function closeModalOutside(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

function saveTask() {
  const subj = document.getElementById('f-subject').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const due = document.getElementById('f-due').value;
  if (!subj||!title||!due) { alert('科目名・課題タイトル・締切日は必須です'); return; }
  const data = {
    subject: subj, title, due,
    time: document.getElementById('f-time').value,
    priority: document.getElementById('f-priority').value,
    submit: document.getElementById('f-submit').value,
    notes: document.getElementById('f-notes').value,
  };
  if (editId) {
    const idx = tasks.findIndex(t=>t.id===editId);
    tasks[idx] = {...tasks[idx], ...data};
  } else {
    tasks.push({id:genId(), done:false, createdAt: new Date().toISOString(), ...data});
  }
  save(); render(); closeModal();
}

function editTask(id) { openModal(id); }
function toggleDone(id) {
  const t = tasks.find(x=>x.id===id);
  if (!t) return;
  const wasUndone = !t.done;
  t.done = !t.done;
  save();

  if (wasUndone) {
    // XP計算
    const xpGain = t.priority === 'high' ? 30 : t.priority === 'low' ? 10 : 20;
    const earlyBonus = daysDiff(t) >= 3 ? 10 : 0;
    const total = xpGain + earlyBonus;
    game.totalDone++;
    updateStreak();
    awardXp(total, t);
    checkBadges(t);
    saveGame();

    // 紙吹雪＋トースト
    launchConfetti(70);
    const praise = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    const bonusMsg = earlyBonus ? ` (早期ボーナス +${earlyBonus}XP)` : '';
    showToast(praise, `+${total} XP 獲得！${bonusMsg}`);
  }

  render();
}

function setTab(tab, el) {
  currentTab = tab;

}
